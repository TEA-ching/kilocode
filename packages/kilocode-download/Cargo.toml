[package]
name = "kilocode-download"
version = "0.1.0"
edition = "2024"

[lib]
name = "kilocode_download"
path = "src/lib.rs"

[[bin]]
name = "kilocode-download"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive", "env"] }
thiserror = "2.0.18"
log = "0.4.22"
env_logger = "0.11.0"
octocrab = "0.54.0"
reqwest = { version = "0.13.4", features = ["rustls"] }
rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1.52.4", features = ["full"] }
serde_json = "1.0.140"
chrono = "0.4.39"
bytes = "1.8.0"
flate2 = "1.0.35"
tar = "0.4.43"
zip = "2.2.2"

[dev-dependencies]
mockito = "1.7.2"
tokio-test = "0.4.5"
bytes = "1.8.0"
tempfile = "3.17.1"
